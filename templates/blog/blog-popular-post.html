{% load static %}
<div class="single-sidebar-widget popular-post-widget">
    <h4 class="popular-title">Popular Posts</h4>
    <div class="popular-post-list">
        {% for post in posts %}
        <div class="single-post-list d-flex flex-row align-items-center">
            <div class="thumb">
                <img style="max-width: 100px;border-radius: 10%;box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.5);" class="img-fluid " src="{{post.image.url}}" alt="">
            </div>
            <div class="details">
                <a href="{% url 'blog:single' pid=post.id %}">
                    <h6 style="font-weight: bold;color: #333;text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);">{{post.title}}</h6>
                </a>
                <p>{{post.published_date|date:"d M Y"}}</p>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
